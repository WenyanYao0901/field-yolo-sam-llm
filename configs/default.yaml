# =============================================================================
# 默认运行参数（YOLO 检测 / SAM 精炼 / LLM 质检报告）
# 由 main.py 加载；命令行同名参数可覆盖本文件
# =============================================================================

# ---------- 主模型：YOLO 实时检测 ----------
model:
  # 通用预训练仅用于跑通流程；田间三类请换成 runs/detect/train/.../best.pt
  name: yolov8s.pt
  imgsz: 640         # 训练与推理输入边长
  conf: 0.25         # 默认置信度阈值
  iou: 0.45          # NMS IoU 阈值
  device: ""         # 空=自动选择 cuda/mps/cpu；也可填 "0" / "cpu"

# ---------- 闭环流水线 ----------
pipeline:
  source: data/raw                 # 默认输入：原始田间图 / 示例图
  save_dir: runs/pipeline/run      # 闭环输出根目录
  conf_low: 0.25                   # 难例：不确定区间下界
  conf_high: 0.6                   # 难例上界 / 伪标签门槛
  hard_score_thresh: 0.45          # 难例分数阈值
  skip_sam: false                  # true 时跳过 SAM
  skip_llm: false                  # true 时跳过 LLM

# ---------- 视觉大模型 SAM（精炼框） ----------
assist:
  # SAM 权重需自行下载到 weights/
  sam_checkpoint: weights/sam_vit_b_01ec64.pth
  sam_type: vit_b    # 与权重匹配: vit_b / vit_l / vit_h

# ---------- 语言大模型（质检 + 报告） ----------
llm:
  # 默认 DeepSeek；切 GPT 时可改 base_url 与 model
  # API Key 请用环境变量 LLM_API_KEY 或 DEEPSEEK_API_KEY，勿写入仓库
  base_url: https://api.deepseek.com
  model: deepseek-chat
  temperature: 0.2
