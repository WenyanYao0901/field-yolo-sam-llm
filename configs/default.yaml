# =============================================================================
# 默认运行参数（YOLO 检测 / SAM 精炼 / LLM 质检报告）
# 命令行参数可覆盖本文件中的同义项
# =============================================================================

# ---------- 主模型：YOLO 实时检测 ----------
model:
  name: yolov8s.pt   # 可选: yolov8s.pt / yolo11s.pt / 自训 best.pt
  imgsz: 640         # 训练与推理输入边长
  conf: 0.25         # 默认置信度阈值
  iou: 0.45          # NMS IoU 阈值
  device: ""         # 空=自动选择 cuda/mps/cpu；也可填 "0" / "cpu"

# ---------- 闭环流水线 ----------
pipeline:
  source: data/raw                 # 默认输入：原始田间图 / 示例图
  save_dir: runs/pipeline/run      # 闭环输出根目录
  conf_low: 0.25                   # 难例：不确定区间下界
  conf_high: 0.6                   # 难例上界 / 伪标签门槛
  hard_score_thresh: 0.45          # 难例分数阈值

# ---------- 视觉大模型 SAM（精炼框） ----------
assist:
  # SAM 权重需自行下载到 weights/
  sam_checkpoint: weights/sam_vit_b_01ec64.pth
  sam_type: vit_b    # 与权重匹配: vit_b / vit_l / vit_h

# ---------- 语言大模型（质检 + 报告） ----------
llm:
  # 默认 DeepSeek；切 GPT 时可改 base_url 与 model
  base_url: https://api.deepseek.com
  model: deepseek-chat
  temperature: 0.2
  # API Key 写死在 src/assist/llm_review.py 的 LLM_API_KEY 常量中
