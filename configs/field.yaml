# =============================================================================
# 田间目标检测数据集配置（Ultralytics YOLO 格式）
# 类别与论文三类任务一致：玉米苗 / 阔叶杂草 / 禾本科杂草
# =============================================================================
# 目录约定（相对 path）:
#   images/train  <-> labels/train
#   images/val    <-> labels/val
#   images/test   <-> labels/test
# 标签每行: <class_id> <cx> <cy> <w> <h>  （归一化到 0~1）
#
# 数据不随仓库发布。请按地块/日期/采集批次划分，不要将同一图像
# 或连拍帧分到不同集合。训练前运行:
#   python scripts/check_dataset_split.py --data configs/field.yaml
# =============================================================================

path: data

train: images/train
val: images/val
test: images/test

# 类别编号必须从 0 连续
names:
  0: maize       # 玉米苗
  1: broadleaf   # 阔叶杂草
  2: grass       # 禾本科杂草
